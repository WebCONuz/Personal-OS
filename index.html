<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal OS — shaxsiy rivojlanish platformasi: maqsadlar, haftalik reja, moliya va odatlar." />
    <meta name="theme-color" content="#fbfbfc" />
    <title>Personal OS</title>
    <script>
      // Applies the saved theme before first paint so dark mode never flashes light.
      // Keep in sync with src/hooks/useTheme.ts (a missing profile means the "system" default).
      try {
        var theme = JSON.parse(localStorage.getItem('personal-os:profile') || '{}').theme
        if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
